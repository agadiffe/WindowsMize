[LegalNotice]
# Legal Notice popup at first start (default: false)
Accepted=true

[Preferences]
# Behavior > Inhibit system sleep when torrents are downloading (default: false)
General\PreventFromSuspendWhenDownloading=true

# Behavior > Inhibit system sleep when torrents are seeding (default: false)
General\PreventFromSuspendWhenSeeding=false

# Behavior > Check for program updates (default: true)
Advanced\updateCheck=true

[GUI]
# View > Filters Sidebar (default: true)
MainWindow\FiltersSidebarVisible=false

[BitTorrent]
# BitTorrent > Enable DHT (decentralzed network) to find more peers (default: true)
Session\DHTEnabled=true

# BitTorrent > Enable Peer Exchange (PeX) to find more peers (default: true)
Session\PeXEnabled=true

# BitTorrent > Enable Local Peer Discovery to find more peers (default: true)
Session\LSDEnabled=true

# BitTorrent > Encryption mode\ allowed: 0 (default) | required: 1 | disabled: 2
Session\Encryption=1

# BitTorrent > Enable anonymous mode (default: false)
Session\AnonymousModeEnabled=true

# Connection > Peer connection protocol\ TCP and µTP: Both (default) | TCP: TCP | µTP: UTP
Session\BTProtocol=Both

# Connection > Port used for incoming connections (default: random)
#   Set to 0 to let your system pick an unused port
#Session\Port=0

# Connection > Global maximum number of connections (default: 500)
Session\MaxConnections=500

# Connection > Maximum number of connections per torrent (default: 100)
Session\MaxConnectionsPerTorrent=100

# Connection > Global maximum number of upload slots (default: 20)
Session\MaxUploads=20

# Connection > Maximum number of upload slots per torrent (default: 4)
Session\MaxUploads=4

# Download > Pre-allocate disk space for all files (default: false)
Session\Preallocation=false

# Download > Append .!qB extension to incomplete files (default: false)
Session\AddExtensionToIncompleteFiles=true

[Network]
# Connection > Use UPnP / NAT-PMP port forwarding from my router (default: true)
PortForwardingEnabled=true
